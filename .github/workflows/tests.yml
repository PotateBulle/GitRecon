name: Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Ruff, pytest, Bandit and pip-audit

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project and development dependencies
        run: pip install -e ".[dev]"

      - name: Run Ruff
        run: ruff check tests gitrecon

      - name: Run pytest
        run: pytest -q

      - name: Run Bandit
        run: bandit -r gitrecon

      - name: Run pip-audit
        run: pip-audit