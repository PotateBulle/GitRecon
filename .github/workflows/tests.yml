name: Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Ruff, pytest, Bandit and pip-audit

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip "setuptools>=83.0.0" wheel

      - name: Install project and development dependencies
        run: pip install -e ".[dev]"

      - name: Run Ruff
        run: ruff check tests gitrecon

      - name: Run pytest
        run: pytest -q

      - name: Run Bandit
        run: bandit -r gitrecon

      - name: Run pip-audit
        run: pip-audit