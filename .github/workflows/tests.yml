name: Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Ruff, pytest, Bandit and pip-audit

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip "setuptools>=83.0.0" wheel

      - name: Install project and development dependencies
        run: pip install -e ".[dev]"

      - name: Run Ruff
        run: ruff check tests gitrecon

      - name: Run pytest
        run: pytest -q

      - name: Run Bandit
        run: bandit -r gitrecon

      - name: Run pip-audit
        run: pip-audit