[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"


[project]
name = "gitrecon"
version = "0.3.7"
description = "GitHub Repository Intelligence & Security Scanner"
readme = "README.md"
requires-python = ">=3.11"

authors = [
    { name = "PotateBulle" }
]

dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "typer>=0.12",
]


[project.optional-dependencies]
dev = [
    "bandit>=1.8",
    "pip-audit>=2.9",
    "pytest>=8.0",
    "ruff>=0.6",
]


[project.scripts]
gitrecon = "gitrecon.cli:app"


[tool.setuptools.packages.find]
where = ["."]
include = ["gitrecon*"]
exclude = [
    "tests*",
    "reports*",
]


[tool.ruff]
line-length = 88
target-version = "py311"


[tool.pytest.ini_options]
testpaths = ["tests"]